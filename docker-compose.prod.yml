# Production overrides. Merge explicitly on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  app:
    build:
      target: runner
      args:
        DATABASE_URI: ${DATABASE_URI:-postgres://payload:payload@postgres:5432/payload}
        PAYLOAD_SECRET: ${PAYLOAD_SECRET:-change-me}
    environment:
      NODE_ENV: production
    volumes:
      - uploads:/app/media
    restart: unless-stopped

  postgres:
    restart: unless-stopped

volumes:
  uploads:
