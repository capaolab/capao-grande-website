# Preview de UI (Vercel, site estático) — para o cliente visualizar e aprovar
# alterações visuais. Sem Payload/Postgres: o conteúdo vem do seed em memória
# (CONTENT_SOURCE=static). Não é o ambiente de homologação — esse roda a
# imagem Docker publicada pelo workflow release.yml (ver README).
#
# Gatilho: tag `preview-*` (ex.: preview-home-nova, preview-2026-09-25) ou
# execução manual (aba Actions → Run workflow, escolhendo a branch).
name: Deploy Preview (UI)
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.CAPAOGRANDE_PROJECT_ID }}
on:
  push:
    tags:
      - 'preview-*'
  workflow_dispatch:

# Um preview por ref de cada vez; um novo push da mesma tag/branch cancela o
# anterior em andamento.
concurrency:
  group: deploy-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Deploy-Preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Use static seed content instead of Payload/Postgres
        # lib/queries.ts e next.config.ts leem esta variável para usar
        # content/static-content.ts (dados de content/seed-data.ts resolvidos
        # em memória) em vez do Payload Local API — o preview na Vercel não
        # tem banco. `vercel build` propaga o conteúdo de
        # .vercel/.env.preview.local (gerado por `vercel pull` acima) para o
        # `next build` que ele roda internamente.
        run: echo "CONTENT_SOURCE=static" >> .vercel/.env.preview.local
      - name: Exclude Payload admin/API routes from the static export
        # app/(payload) (admin + API REST/GraphQL) é inerentemente dinâmico e
        # incompatível com `output: 'export'` (ver next.config.ts). Precisa
        # sair de dentro de app/ de verdade: o App Router só ignora uma
        # pasta se ela não estiver na árvore que ele varre — renomear no
        # lugar (ex.: sufixo `_disabled`) NÃO basta, pois deixa de casar com
        # a sintaxe de route group `(nome)` e vira um segmento de rota
        # literal, então o Next tentaria construir as rotas dinâmicas de
        # dentro dela mesmo assim. O runner é descartado ao final do job.
        run: mv "app/(payload)" "../payload-route-group-excluded-from-static-export"
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Publish preview URL
        # URL no resumo da execução: é o link a enviar ao cliente.
        run: |
          {
            echo "### Preview de UI publicado"
            echo ""
            echo "- Ref: \`${{ github.ref_name }}\`"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
