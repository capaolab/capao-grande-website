# Release da aplicação completa (Next.js + Payload) como imagem Docker no
# GitHub Container Registry da organização:
#
#   ghcr.io/capaolab/capao-grande-website:<versão>
#
# A mesma imagem é implantada em homologação (staging) e produção — o deploy
# é MANUAL no servidor (sem IP externo para o GitHub Actions alcançar); ver
# deploy/ e o README.
#
# Gatilho: tag `release-X.Y` ou `release-X.Y.Z` (ex.: release-1.2.0).
# A tag vira a versão da imagem (`1.2.0`) e uma GitHub Release com notas
# geradas a partir dos commits.
name: Release

on:
  push:
    tags:
      - 'release-*.*'

# Releases nunca rodam em paralelo nem se cancelam: cada tag publica a sua.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verificar (tipos + testes)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate tag format
        id: version
        # release-1.2 ou release-1.2.3 (sufixo opcional -rc.1 etc.). Tags
        # fora do padrão falham cedo, antes de publicar qualquer coisa.
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^release-([0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?)$ ]]; then
            echo "::error::Tag '$tag' fora do padrão release-X.Y[.Z][-sufixo]"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests (sem integração com Postgres)
        # Os *.integration.test.ts precisam de um Postgres com seed; ficam de
        # fora do gate de release.
        run: npx vitest --run --exclude 'tests/**/*.integration.test.ts'

  publish:
    name: Publicar imagem
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar a GitHub Release
      packages: write # publicar no ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Versão imutável (1.2.0) + sha curto para rastreio. Sem `latest`:
          # staging/produção sempre fixam a versão explicitamente.
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=capao-grande-website
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "v${{ needs.verify.outputs.version }}" \
            --generate-notes \
            --notes "Imagem: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.verify.outputs.version }}\`"
      - name: Summary
        run: |
          {
            echo "### Release ${{ needs.verify.outputs.version }} publicada"
            echo ""
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.verify.outputs.version }}"
            echo "./deploy/deploy.sh staging ${{ needs.verify.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
