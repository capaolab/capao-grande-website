# Development overrides. Loaded automatically by `docker compose up` alongside
# docker-compose.yml, so no extra flags are needed for local development.

services:
  app:
    build:
      target: dev
    environment:
      NODE_ENV: development
      # Admin criado pelo `npm run seed` (só em desenvolvimento).
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - ./:/app
      - /app/node_modules
    command: npm run dev

  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
